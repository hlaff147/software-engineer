[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mutation-testing-python"
version = "0.1.0"
description = "Guia e Demonstração Prática de Teste Mutante (Mutation Testing) em Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mutmut>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]

[tool.mutmut]
paths_to_mutate = ["src"]



