[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-driven-development-agentic"
version = "0.1.0"
description = "Demonstração e Guia: A Evolução do SDD (Spec-Driven Development) na Era Agêntica"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "hypothesis>=6.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = ["test_*.py"]
pythonpath = ["."]

