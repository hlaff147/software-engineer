datasources:
  default:
    url: jdbc:h2:mem:fleet_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    schema-generate: CREATE_DROP

jpa:
  default:
    properties:
      hibernate:
        show_sql: true
        format_sql: false
        generate_statistics: true
        hbm2ddl:
          auto: create-drop
